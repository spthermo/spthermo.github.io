<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="shortcut icon" type="image/jpeg" href="{{ '/assets/images/deepArtMe.jpg' | relative_url }}">
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-wrap">
      <aside class="sidebar">
        <img class="author-avatar" src="{{ '/assets/images/me.jpg' | relative_url }}" alt="Spyridon Thermos">
        <h1 class="author-name">Spyridon (Spiros) Thermos</h1>
        <p class="author-tagline">Computer Scientist and Co-Founder of <a href="https://moverse.ai/" target="_blank" rel="noopener">Moverse</a></p>
        <ul class="author-social">
          <li>
            <a href="mailto:spiros@moverse.ai" title="Email" aria-label="Email">
              <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            </a>
          </li>
          <li>
            <a href="https://uk.linkedin.com/in/spirosthermos" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn">
              <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
            </a>
          </li>
          <li>
            <a href="https://scholar.google.gr/citations?hl=el&user=AySuDPYAAAAJ&view_op=list_works&sortby=pubdate" target="_blank" rel="noopener" title="Google Scholar" aria-label="Google Scholar">
              <i class="fa-brands fa-google-scholar" aria-hidden="true"></i>
            </a>
          </li>
          <li>
            <a href="https://github.com/spthermo/" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
              <i class="fa-brands fa-github" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
      </aside>
      <main class="content">
        <nav class="section-nav">
          <a href="#about">About Me</a>
          <a href="#news">News</a>
          <a href="#publications">Research</a>
          <a href="#teaching">Teaching</a>
        </nav>
        {{ content }}
        <footer class="site-footer">
          <p>Design inspired by <a href="https://mmistakes.github.io/minimal-mistakes/" target="_blank" rel="noopener">Minimal Mistakes</a>.</p>
        </footer>
      </main>
      <aside class="linkedin-sidebar">
        <h2 class="linkedin-heading">Spiros' Feed</h2>
        <div class="linkedin-slider">
          <button type="button" class="linkedin-nav prev" aria-label="Scroll to previous post">
            <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
          </button>
          <div class="linkedin-track">
            <div class="linkedin-post"><iframe src="https://www.linkedin.com/embed/feed/update/urn:li:share:7510993489065832450?collapsed=1" height="670" width="504" frameborder="0" allowfullscreen title="Embedded post"></iframe></div>
            <div class="linkedin-post"><iframe src="https://www.linkedin.com/embed/feed/update/urn:li:share:7469697428070330368?collapsed=1" height="543" width="504" frameborder="0" allowfullscreen title="Embedded post"></iframe></div>
            <div class="linkedin-post"><iframe src="https://www.linkedin.com/embed/feed/update/urn:li:ugcPost:7467235150947311617?collapsed=1" height="542" width="504" frameborder="0" allowfullscreen title="Embedded post"></iframe></div>
          </div>
          <button type="button" class="linkedin-nav next" aria-label="Scroll to next post">
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <p class="linkedin-more"><a href="https://www.linkedin.com/in/spirosthermos/recent-activity/all/" target="_blank" rel="noopener">See more on LinkedIn &rarr;</a></p>
      </aside>
    </div>
    <script src="{{ '/js/hidebib.js' | relative_url }}"></script>
    <script src="{{ '/js/linkedin-feed.js' | relative_url }}"></script>
    <script>hideallbibs(); initLinkedInSlider();</script>
  </body>
</html>
